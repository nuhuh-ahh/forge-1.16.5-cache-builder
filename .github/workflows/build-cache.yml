name: Build Forge 1.16.5 Linux x64 Cache

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Forge 1.16.5 and Cache All Dependencies
        run: ./gradlew build --no-daemon

      - name: Verify Offline Build on Linux x64
        run: ./gradlew clean build --offline --stacktrace --no-daemon

      - name: Package Linux Cache into <=94MB Chunks
        run: python3 .github/scripts/package_linux.py

      - name: Create GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 dist/* --title "Forge 1.16.5 Linux x64 Offline Cache" --notes "Pre-cached Forge 1.16.5 with Temurin JDK 8 Linux x64"
